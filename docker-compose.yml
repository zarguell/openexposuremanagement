services:
  postgres:
    image: postgres:16-alpine
    container_name: oem-postgres
    environment:
      POSTGRES_USER: oem
      POSTGRES_PASSWORD: password
      POSTGRES_DB: oem
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oem"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oem-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: oem-api
    environment:
      DATABASE_URL: postgres://oem:password@postgres:5432/oem?sslmode=disable
      API_PORT: 8080
      DEMO_MODE: "true"
      DEMO_API_KEY: demo-key-for-development-only
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oem-network
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: oem-ui
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - oem-network
    restart: unless-stopped

  test-postgres:
    image: postgres:16-alpine
    container_name: oem-test-postgres
    environment:
      POSTGRES_USER: oem
      POSTGRES_PASSWORD: oem
      POSTGRES_DB: oem_test
    ports:
      - "5433:5432"
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oem"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oem-network
    profiles:
      - test

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: oem-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@oem.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - oem-network
    restart: unless-stopped

volumes:
  postgres-data:
  test-postgres-data:

networks:
  oem-network:
    driver: bridge
